    function _aimNote(ctx, freq, startTime, duration, vol) {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.setValueAtTime(freq, startTime);
      gain.gain.setValueAtTime(0.0, startTime);
      gain.gain.linearRampToValueAtTime(vol, startTime + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(startTime);
      osc.stop(startTime + duration + 0.05);

          _aimNote(ctx, 988, t + 0.20, 0.22, 0.35); // B5 — highest, loudest

        return () => clearInterval(t);

      // ── FIFO OOR Analyzer ──
      const DELIVERY_LOCATIONS = new Set(['PREPWIP', 'PRECLAM', 'PREBISTRO', 'PREAPPLE', 'PREPACK', 'MASTERPKS']);
      const LOCATION_MAPPING = {
        'PREPWIP': 'Bistro',
        'PRECLAM': 'Salad',
        'PREBISTRO': 'Bistro',
        'PREAPPLE': 'Apple',
        'PREPACK': 'MasterPacks',
        'MASTERPKS': 'MasterPacks'
      };

      const analyzeFIFOOOR = async (csvFile) => {
        setOorLoading(true);
        setOorMessage(null);
        try {
          const text = await csvFile.text();
          const lines = text.split('\n');
          const oorItems = [];
          const uniqueKeys = new Set(); // Prevent duplicates

          // Helper function to run FIFO analysis on a specific date column
          const runFIFOAnalysis = (dateSource) => {
            const dataByItem = {};
            
            // Parse CSV (skip first 5 header rows)
            for (let i = 5; i < lines.length; i++) {
              const line = lines[i].trim();
              if (!line || line.includes('ITEM TOTAL')) continue;

              const cols = line.split(',').map(c => c.trim());
              if (cols.length < 11) continue;

              const itemNum = cols[0];
              const description = cols[1];
              const poNum = cols[4];
              const lotNum = cols[5];
              const location = cols[7];
              const harvestDate = cols[9];  // Column J
              const expireDate = cols[10];  // Column K

              // Skip invalid entries
              if (!itemNum || !itemNum.match(/^\d+$/) || !location) continue;

              // Mark HOLD locations - include in date calculation but never report as OOR
              const isHold = location === 'HOLD';

              // Select date based on dateSource parameter
              let dateToUse = null;
              if (dateSource === 'harvest') {
                dateToUse = (harvestDate && harvestDate !== 'NA') ? harvestDate : null;
              } else if (dateSource === 'expiration') {
                dateToUse = (expireDate && expireDate !== 'NA') ? expireDate : null;
              }

              if (!dateToUse) continue;

              // Initialize item object
              if (!dataByItem[itemNum]) {
                dataByItem[itemNum] = { description, dates: {} };
              }

              // Store entry by date
              if (!dataByItem[itemNum].dates[dateToUse]) {
                dataByItem[itemNum].dates[dateToUse] = [];
              }

              dataByItem[itemNum].dates[dateToUse].push({
                item: itemNum,
                description,
                po: poNum,
                lot: lotNum,
                location,
                harvestDate,
                expireDate,
                dateKey: dateToUse,
                isDelivery: DELIVERY_LOCATIONS.has(location),
                isHold: location === 'HOLD',
                isExpired: (() => {
                  const today = new Date().toISOString().split('T')[0];
                  const parts = expireDate.split('/');
                  if (parts.length !== 3) return false;
                  const expFormatted = `${parts[2]}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`;
                  return expFormatted < today;
                })(),
                dateSource: dateSource
              });
            }

            // Analyze each item for OOR
            const results = [];

            // Helper: convert MM/DD/YYYY to YYYY-MM-DD for proper date sorting
            const toSortable = (d) => {
              const parts = d.split('/');
              if (parts.length !== 3) return d;
              return `${parts[2]}-${parts[0].padStart(2,'0')}-${parts[1].padStart(2,'0')}`;
            };

            for (const itemNum in dataByItem) {
              const itemData = dataByItem[itemNum];

              // Sort dates chronologically (convert MM/DD/YYYY → YYYY-MM-DD for sort)
              const datesSorted = Object.keys(itemData.dates).sort((a, b) => toSortable(a).localeCompare(toSortable(b)));

              if (datesSorted.length < 2) continue;

              // Check if item has ANY delivery locations - if not, skip entirely
              let hasDeliveryLocation = false;
              for (const date of datesSorted) {
                for (const entry of itemData.dates[date]) {
                  if (entry.isDelivery) {
                    hasDeliveryLocation = true;
                    break;
                  }
                }
                if (hasDeliveryLocation) break;
              }
              
              if (!hasDeliveryLocation) continue; // Skip items with NO delivery locations

              // FIFO OOR Logic:
              // 1. Find OLDEST warehouse date (including HOLD - so true oldest is known)
              // 2. Check if any delivery date is NEWER than that oldest warehouse date
              // 3. If YES → oldest warehouse items are OOR (HOLD items are never reported)

              let oldestWarehouseDate = null;
              for (const date of datesSorted) {
                for (const entry of itemData.dates[date]) {
                  // Include HOLD in date calculation (so we know the true oldest date)
                  if (!entry.isDelivery) {
                    if (!oldestWarehouseDate || toSortable(date) < toSortable(oldestWarehouseDate)) {
                      oldestWarehouseDate = date;
                    }
                  }
                }
              }

              if (!oldestWarehouseDate) continue;

              // Check if ANY delivery date is NEWER than oldest warehouse date
              let hasNewerDeliveryDate = false;
              for (const date of datesSorted) {
                for (const entry of itemData.dates[date]) {
                  if (entry.isDelivery && toSortable(date) > toSortable(oldestWarehouseDate)) {
                    hasNewerDeliveryDate = true;
                    break;
                  }
                }
                if (hasNewerDeliveryDate) break;
              }

              // If newer delivery dates exist, oldest warehouse items are OOR
              // But NEVER report HOLD items - they are included in date math only
              if (hasNewerDeliveryDate) {
                // Collect which delivery rooms triggered the OOR
                const triggeringRooms = new Set();
                for (const date of datesSorted) {
                  for (const entry of itemData.dates[date]) {
                    if (entry.isDelivery && toSortable(date) > toSortable(oldestWarehouseDate)) {
                      triggeringRooms.add(entry.location);
                    }
                  }
                }

                for (const entry of itemData.dates[oldestWarehouseDate]) {
                  // Skip delivery locations AND skip HOLD locations from reporting
                  if (!entry.isDelivery && !entry.isHold) {
                    results.push({ ...entry, deliveryRooms: Array.from(triggeringRooms) });
                  }
                }
              }
            }
            
            return results;
          };

          // Run analysis on Harvest Dates
          const harvestOORItems = runFIFOAnalysis('harvest');
          for (const item of harvestOORItems) {
            const uniqueKey = `${item.item}_${item.lot}_${item.location}`;
            if (!uniqueKeys.has(uniqueKey)) {
              oorItems.push(item);
              uniqueKeys.add(uniqueKey);
            }
          }

          // Run analysis on Expiration Dates
          const expirationOORItems = runFIFOAnalysis('expiration');
          for (const item of expirationOORItems) {
            const uniqueKey = `${item.item}_${item.lot}_${item.location}`;
            if (!uniqueKeys.has(uniqueKey)) {
              oorItems.push(item);
              uniqueKeys.add(uniqueKey);
            }
          }

          setOorItems(oorItems.sort((a, b) => a.item === b.item ? a.dateKey.localeCompare(b.dateKey) : a.item.localeCompare(b.item)));

        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > MAX_SIZE || h > MAX_SIZE) {
              if (w > h) { h = Math.round(h * MAX_SIZE / w); w = MAX_SIZE; }
              else { w = Math.round(w * MAX_SIZE / h); h = MAX_SIZE; }

              if (!blob) { reject(new Error('Compression failed')); return; }
              resolve(blob);
            }, 'image/jpeg', QUALITY);

                                        <div style={{ background:'linear-gradient(90deg,#38bdf8,#7dd3fc)', height:'100%', width:`${(room.total/maxDashRoomTotal)*100}%` }} />

                        <div style={{ marginTop:'0.6rem', fontSize:'0.65rem', color:'#334155' }}>Click a row to filter dashboard by that room</div>

                    );

                });
              })()}

            </div>
            {_breakPanelJsx}
            {_chatUI}
            {_chatFab}
          </div>
        );
      }
      if (screen === "completed") {
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const thisWeek = new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);
        const thisMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const yesterday = getYesterday();
        const completedReqs = [...requests, ...archivedRequests].filter(r => r.status === "completed" || r.status === "cancelled");
        const filteredCompletedReqs = completedReqs.filter(r => {
          const ts = new Date(r.completedAt || r.cancelledAt || r.submittedAt);
          if (timeFilter === "today")     return ts >= today;
          if (timeFilter === "week")      return ts >= thisWeek;
          if (timeFilter === "month")     return ts >= thisMonth;
          if (timeFilter === "yesterday") return ts >= yesterday.start && ts <= yesterday.end;
          if (timeFilter === "custom") {
            if (exportDateFrom && ts < new Date(exportDateFrom)) return false;
            if (exportDateTo && ts > new Date(exportDateTo + "T23:59:59")) return false;
            return true;
          }
          return true; // all
        }).filter(r => !exportRoom || r.room === exportRoom);
        const sortedCompleted = [...filteredCompletedReqs].sort((a, b) => {
          return new Date(b.completedAt || b.cancelledAt || 0) - new Date(a.completedAt || a.cancelledAt || 0);
        });
        const totalCompleted = sortedCompleted.length;
        const completedOnly = sortedCompleted.filter(r => r.status === "completed");
        const avgTime = completedOnly.length > 0
          ? Math.round(completedOnly.reduce((sum, r) =>
              sum + (new Date(r.completedAt) - new Date(r.submittedAt)) / 60000, 0) / completedOnly.length)
          : 0;
        const pickable = completedOnly.filter(r => r.claimedAt &&
          (new Date(r.completedAt) - new Date(r.claimedAt)) > 0);
        const avgPickTimeCompleted = pickable.length > 0
          ? Math.round(pickable.reduce((sum, r) =>
              sum + (new Date(r.completedAt) - new Date(r.claimedAt)) / 60000, 0) / pickable.length)
          : 0;
        const buildRows = (data) => data.map(r => {
          const start = new Date(r.submittedAt);
          const end = new Date(r.completedAt);
          const timeMin = Math.round((end - start) / 60000);
          return [r.id, r.item, r.room, r.qty + (r.adjQty ? ` (remaining:${r.adjQty})` : ''),
            r.unit||'cases',
            r.priority ? 'HIGH' : 'NORMAL', new Date(r.submittedAt).toLocaleString(),
            r.submittedBy||'', r.claimedBy||'', new Date(r.completedAt).toLocaleString(),
            r.completedBy||'', timeMin, (r.comments||'').replace(/,/g,';')];
        });
        const exportToCSV = () => {
          const headers = ["ID","Item","Room","Qty","Unit","Priority","Submitted At","Submitted By","Claimed By","Completed At","Completed By","Time (min)","Comments"];
          const rows = buildRows(sortedCompleted);
          const csv = [headers.join(','), ...rows.map(row => row.map(c=>`"${c}"`).join(','))].join('\n');
          const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          const label = timeFilter==="custom" ? `${exportDateFrom||'start'}-to-${exportDateTo||'end'}` : timeFilter==="yesterday" ? "yesterday" : timeFilter;
          a.download = `completed-${label}${exportRoom?'-'+exportRoom:''}-${new Date().toISOString().split('T')[0]}.csv`;
          a.click();
        };
        const exportToPDF = () => {
          const label = timeFilter==="custom" ? `${exportDateFrom||'start'} → ${exportDateTo||'end'}` : timeFilter==="yesterday" ? "Yesterday" : timeFilter.charAt(0).toUpperCase()+timeFilter.slice(1);
          const roomLabel = exportRoom ? ` · ${exportRoom}` : "";
          const w = window.open('','_blank');
          w.document.write(`<!DOCTYPE html><html><head><title>Completed Requests Export</title>
<style>
  body{font-family:'Segoe UI',Arial,sans-serif;padding:20px;color:#111;background:#fff;}
  h1{font-size:1.4rem;margin:0 0 4px 0;} .meta{color:#666;font-size:0.85rem;margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;font-size:0.8rem;}
  th{background:#0a0e1a;color:#00ff88;padding:8px 10px;text-align:left;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  td{padding:7px 10px;border-bottom:1px solid #e5e7eb;vertical-align:top;}
  tr:nth-child(even) td{background:#f9fafb;}
  .high{background:#fee2e2;color:#b91c1c;padding:2px 6px;border-radius:4px;font-weight:700;font-size:0.75rem;}
  .time-ok{color:#16a34a;font-weight:700;} .time-warn{color:#ca8a04;font-weight:700;} .time-bad{color:#dc2626;font-weight:700;}
  @media print{body{padding:0;} button{display:none;}}
</style></head><body>
<h1>📦 Completed Requests Export</h1>
<div class="meta">Period: ${label}${roomLabel} · Generated: ${new Date().toLocaleString()} · Total: ${sortedCompleted.length} records</div>
<button onclick="window.print()" style="margin-bottom:12px;padding:8px 16px;background:#0a0e1a;color:#00ff88;border:none;border-radius:6px;cursor:pointer;font-weight:700;">🖨️ Print / Save as PDF</button>
<table><thead><tr><th>Item</th><th>Room</th><th>Qty</th><th>Unit</th><th>Priority</th><th>Submitted</th><th>Completed</th><th>Time</th><th>Claimed By</th><th>Completed By</th><th>Comments</th></tr></thead><tbody>
${sortedCompleted.map(r => {
  const tmin = Math.round((new Date(r.completedAt)-new Date(r.submittedAt))/60000);
  const tc = tmin<=5?'time-ok':tmin<=10?'time-warn':'time-bad';
  return `<tr><td><strong>${r.item}</strong></td><td>${r.room}</td><td>${r.qty}${r.adjQty?` <small>(remaining:${r.adjQty})</small>`:''}</td><td style=\"font-weight:700;color:${(r.unit||'cases')==='pallet'?'#c2410c':(r.unit||'cases')==='item drop'?'#7c3aed':'#0369a1'}\">${r.unit||'cases'}</td>
<td>${r.priority?'<span class="high">HIGH</span>':''}</td>
<td>${new Date(r.submittedAt).toLocaleString()}<br><small style="color:#666">${r.submittedBy||''}</small></td>
<td>${new Date(r.completedAt).toLocaleString()}</td>
<td class="${tc}">${tmin}min</td><td>${r.claimedBy||'—'}</td><td>${r.completedBy||'—'}</td><td>${r.comments||''}</td></tr>`;
}).join('')}
</tbody></table></body></html>`);
          w.document.close();
        };

                  <div style={{ color:'#8b9dc3', fontSize:'0.8rem', textTransform:'uppercase', letterSpacing:'0.05em' }}>Total Completed</div>
                  <div style={{ color:'#00ff88', fontSize:'2.5rem', fontWeight:900, marginTop:'0.5rem' }}>{totalCompleted}</div>
                </div>

                <div style={{ background:'rgba(15,23,42,0.85)', border:'1px solid rgba(0,255,136,0.2)', borderRadius:'14px', padding:'1.5rem' }}>

                  <div style={{ color:'#00ff88', fontSize:'2.5rem', fontWeight:900, marginTop:'0.5rem' }}>{fmtMins(avgTime)}</div>
                  <div style={{ color:'#64748b', fontSize:'0.72rem', marginTop:'0.25rem' }}>Submit → Delivered</div>

                  <div style={{ color:'#ff9f43', fontSize:'2.5rem', fontWeight:900, marginTop:'0.5rem' }}>{avgPickTimeCompleted > 0 ? fmtMins(avgPickTimeCompleted) : '—'}</div>
                  <div style={{ color:'#64748b', fontSize:'0.72rem', marginTop:'0.25rem' }}>Claim → Delivered · {pickable.length} picks</div>
                </div>
              </div>

              <div style={{ background:'rgba(15,23,42,0.85)', border:'1px solid rgba(0,255,136,0.2)', borderRadius:'14px', overflow:'hidden' }}>
                <div style={{ padding:'1.2rem 1.5rem', background:'linear-gradient(135deg, rgba(0,255,136,0.15) 0%, rgba(0,255,136,0.04) 100%)', borderBottom:'2px solid #00ff88' }}>
                  <div style={{ color:'#00ff88', fontWeight:900, fontSize:'1.1rem', textTransform:'uppercase', letterSpacing:'0.08em' }}>
                    ✅ Completed Requests {timeFilter !== "all" && `(${timeFilter === "today" ? "Today" : timeFilter === "week" ? "This Week" : timeFilter === "month" ? "This Month" : timeFilter === "yesterday" ? "Yesterday" : ""})`}
                    {completedSearch && <span style={{ color:'#fbbf24', fontSize:'0.8rem', marginLeft:'0.75rem', fontWeight:700, textTransform:'none', letterSpacing:'normal' }}>· "{completedSearch}" — {sortedCompleted.filter(r => r.item && r.item.toLowerCase().includes(completedSearch.trim().toLowerCase())).length} match{sortedCompleted.filter(r => r.item && r.item.toLowerCase().includes(completedSearch.trim().toLowerCase())).length !== 1 ? 'es' : ''}</span>}
                  </div>
                </div>

                {(() => {
                  const displayRows = completedSearch.trim()
                    ? sortedCompleted.filter(r => r.item && r.item.toLowerCase().includes(completedSearch.trim().toLowerCase()))
                    : sortedCompleted;
                  return displayRows.length === 0 ? (
                  <div style={{ padding:'4rem 2rem', textAlign:'center', color:'#64748b' }}>
                    <CheckCircle size={64} color="#334155" />
                    <h3 style={{ margin:'1rem 0 0 0' }}>{completedSearch ? `No results for "${completedSearch}"` : 'No completed requests'}</h3>
                    <p style={{ margin:'0.5rem 0 0 0', fontSize:'0.9rem' }}>{completedSearch ? 'Try a different item number' : 'Try changing the time filter'}</p>
                  </div>
                ) : (
                  <div style={{ overflowX:'auto' }}>
                    <table style={{ width:'100%', borderCollapse:'collapse', minWidth:'1100px' }}>
                      <thead>
                        <tr style={{ background:'rgba(0,255,136,0.05)' }}>

                          <th style={headerStyle}>Room</th>

                          <th style={headerStyle}>Priority</th>
                          <th style={headerStyle}>Submitted</th>
                          <th style={headerStyle}>Completed / Cancelled</th>

                          <th style={headerStyle}>By</th>
                          <th style={headerStyle}>Comments</th>
                        </tr>
                      </thead>
                      <tbody>

                          const pickColor = pickMin === null ? '#64748b' : pickMin <= 3 ? '#00ff88' : pickMin <= 7 ? '#fbbf24' : '#ff4444';
                          const rowBg = isCancelled
                            ? (idx % 2 === 0 ? 'rgba(255,68,68,0.04)' : 'rgba(255,68,68,0.07)')
                            : (idx % 2 === 0 ? 'transparent' : 'rgba(0,255,136,0.02)');

              { key:"pick_sla_crit", label:"Critical", unit:"min", desc:"Above this = red (too slow)", min:1, max:120, type:"number" },

        ];
        const DEFAULTS = {

        const updateSetting = (key, val) => {
          const next = { ...curEdit, [key]: val };
          setEditSettings(next);

        const settingsErrors = [];

        const pw2 = parseInt(curEdit.pick_sla_warn), pb2 = parseInt(curEdit.pick_sla_bad), pc2 = parseInt(curEdit.pick_sla_crit);
        if (pw2 >= pb2) settingsErrors.push("Pick SLA Good must be less than Slow");
        if (pb2 >= pc2) settingsErrors.push("Pick SLA Slow must be less than Critical");
        if (parseInt(curEdit.backlog_green_max) >= parseInt(curEdit.backlog_yellow_max)) settingsErrors.push("Backlog Green Max must be less than Yellow Max");
        const handleSaveSettings = async () => {
          setSettingsSaving(true);
          try {
            for (const key of Object.keys(dirtyKeys)) {

            const fresh = await adapterRef.current.loadSettings();
            _updateSysSettings(fresh);
            setDirtyKeys({});

                else if(ex.m>=pb){ebg="#fbbf24";efg="#0a0e1a";}

                  <div>
                    <span style={{color:settingsErrors.length>0?"#ff4444":"#ffd700",fontWeight:800,fontSize:"0.85rem"}}>{settingsErrors.length>0?"⚠️ Validation Error":`⚡ ${Object.keys(dirtyKeys).length} unsaved change${Object.keys(dirtyKeys).length>1?"s":""}`}</span>

                        </div>

                      <div style={{color:"#8b9dc3",fontSize:"0.7rem",fontWeight:800,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:"0.25rem"}}>Live Preview — Request badges will look like:</div>

                          </div>
                          <div style={{position:"absolute",left:`${(parseInt(curEdit.shift_2_start||"14")/24)*100}%`,width:`${((parseInt(curEdit.shift_2_end||"22")-parseInt(curEdit.shift_2_start||"14"))/24)*100}%`,height:"100%",background:"rgba(167,139,250,0.2)",borderLeft:"2px solid #a78bfa",borderRight:"2px solid #a78bfa",display:"flex",alignItems:"center",justifyContent:"center"}}>
                            <span style={{fontSize:"0.6rem",color:"#a78bfa",fontWeight:800}}>2ND</span>
                          </div>

                      </div>
                      <div style={{display:"flex",justifyContent:"space-between",marginTop:"0.25rem"}}>
                        {["00:00","06:00","12:00","18:00","24:00"].map(t=><span key={t} style={{fontSize:"0.55rem",color:"#475569"}}>{t}</span>)}
                      </div>
                    </div>
                  )}

                  {activeSettingsTab==="access" && (() => {
                    const FEATURES = [
                      { key:"new_request", label:"New Request",   icon:"➕" },
                      { key:"picklist",    label:"Pick List",     icon:"📋" },
                      { key:"board",       label:"Board",         icon:"📌" },
                      { key:"dashboard",   label:"Dashboard",     icon:"📊" },
                      { key:"completed",   label:"Completed",     icon:"✅" },
                      { key:"assignments", label:"Assignments",   icon:"🗂️" },
                      { key:"preplist",    label:"Operations",    icon:"⚙️" },
                      { key:"fives",       label:"5S Program",    icon:"🧹" },
                      { key:"breaks",      label:"Break Tracking",icon:"🍵" },
                      { key:"chat",        label:"Chat",          icon:"💬" },

                    const ROLES = ["room","warehouse","supervisor","admin"];
                    const ROLE_COLORS = { room:"#8b9dc3", warehouse:"#fbbf24", supervisor:"#a78bfa", admin:"#ff4444" };
                    const ROLE_EMOJIS = { room:"🍽️", warehouse:"📦", supervisor:"🧭", admin:"🔧" };
                    const currentPerms = safeJsonParse(sysSettings.role_permissions, null) || DEFAULT_ROLE_PERMISSIONS;
                    const currentUserPerms = safeJsonParse(sysSettings.user_permissions, null) || {};
                    const activeUserPerms = pendingUserPerms || currentUserPerms;
                    const hasPendingChanges = pendingUserPerms !== null;

                    const togglePerm = async (role, feature) => {
                      const next = JSON.parse(JSON.stringify(currentPerms));
                      if (!next[role]) next[role] = {};
                      next[role][feature] = !next[role][feature];
                      await adapterRef.current.saveSetting('role_permissions', JSON.stringify(next), userName);
                      const fresh = await adapterRef.current.loadSettings();
                      _updateSysSettings(fresh);
                    };

                    const toggleUserPerm = (targetUser, feature) => {
                      const base = pendingUserPerms || JSON.parse(JSON.stringify(currentUserPerms));
                      const next = JSON.parse(JSON.stringify(base));
                      if (!next[targetUser]) next[targetUser] = {};
                      const targetUserObj = users.find(u => u.name === targetUser);
                      const roleDefault = !!(currentPerms[targetUserObj?.role]?.[feature]);
                      const current = next[targetUser][feature] !== undefined ? next[targetUser][feature] : roleDefault;
                      next[targetUser][feature] = !current;
                      setPendingUserPerms(next);
                      setUserPermsSaved(false);
                    };

                    const saveUserPerms = async () => {
                      const toSave = pendingUserPerms || currentUserPerms;
                      await adapterRef.current.saveSetting('user_permissions', JSON.stringify(toSave), userName);
                      const fresh = await adapterRef.current.loadSettings();
                      _updateSysSettings(fresh);
                      setPendingUserPerms(null);
                      setUserPermsSaved(true);
                      setTimeout(() => setUserPermsSaved(false), 2000);
                    };

                      if (!confirm(`Reset ${targetUser} to their role defaults?`)) return;
                      const base = pendingUserPerms || JSON.parse(JSON.stringify(currentUserPerms));
                      const next = JSON.parse(JSON.stringify(base));
                      delete next[targetUser];
                      await adapterRef.current.saveSetting('user_permissions', JSON.stringify(next), userName);
                      const fresh = await adapterRef.current.loadSettings();
                      _updateSysSettings(fresh);
                      setPendingUserPerms(null);
                    };

                    const resetPerms = async () => {
                      if (!confirm('Reset all role permissions to defaults?')) return;
                      await adapterRef.current.saveSetting('role_permissions', JSON.stringify(DEFAULT_ROLE_PERMISSIONS), userName);
                      const fresh = await adapterRef.current.loadSettings();
                      _updateSysSettings(fresh);

                    const nonSuperUsers = users.filter(u => u.role !== 'superuser');
                    const selectedUserObj = nonSuperUsers.find(u => u.name === selectedUser);

                                        const enabled = !!(currentPerms[role]?.[f.key]);

                                          <td key={role} style={{ padding:'0.7rem 0.75rem', textAlign:'center' }}>
                                            <button onClick={() => togglePerm(role, f.key)}

                                                transition:'all 0.15s' }}>

                                Reset Defaults
                              </button>
                            </div>
                          </div>

                        {accessTab === 'user' && (

                                    </tbody>
                                  </table>
                                </div>
                                <div style={{ marginTop:'0.75rem', color:'#475569', fontSize:'0.72rem' }}>

                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    );
                  })()}

                  {activeSettingsTab==="sounds" && (() => {
                    const SOUND_TYPES = [
                      { key:"new_request",   label:"New Request",    icon:"📦", desc:"Warehouse gets a new delivery request" },
                      { key:"high_priority", label:"High Priority",  icon:"🔥", desc:"Urgent / high priority request arrives" },
                      { key:"completed",     label:"Delivered",      icon:"✅", desc:"Order marked as delivered / done" },
                      { key:"cancelled",     label:"Cancelled",      icon:"❌", desc:"Request was cancelled" },
                      { key:"chat",          label:"Chat Message",   icon:"💬", desc:"New chat message received" },

                    ];
                    return (
                      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:"1rem",marginTop:"0.5rem"}}>
                        {SOUND_TYPES.map(st => {
                          const settingKey = `sound_${st.key}`;
                          const hasCustom = !!(sysSettings[settingKey]);
                          return (
                            <div key={st.key} style={{background:"rgba(167,139,250,0.04)",border:`1px solid ${hasCustom?"rgba(167,139,250,0.4)":"#1e293b"}`,borderRadius:"12px",padding:"1.1rem"}}>

                              <div style={{display:"flex",alignItems:"center",gap:"0.6rem",marginBottom:"0.5rem"}}>
                                <span style={{fontSize:"1.3rem"}}>{st.icon}</span>
                                <div>
                                  <div style={{color:"#e2e8f0",fontWeight:900,fontSize:"0.9rem"}}>{st.label}</div>
                                  <div style={{color:"#64748b",fontSize:"0.68rem"}}>{st.desc}</div>
                                </div>
                                {hasCustom && <span style={{marginLeft:"auto",padding:"0.15rem 0.5rem",background:"rgba(167,139,250,0.2)",borderRadius:"6px",color:"#a78bfa",fontSize:"0.6rem",fontWeight:900,whiteSpace:"nowrap"}}>CUSTOM</span>}
                              </div>

                              <div style={{display:"flex",gap:"0.5rem",flexWrap:"wrap",alignItems:"center",marginTop:"0.75rem"}}>

                                <label style={{padding:"0.45rem 0.85rem",borderRadius:"8px",background:"rgba(167,139,250,0.15)",border:"1px solid rgba(167,139,250,0.35)",color:"#a78bfa",fontWeight:900,fontSize:"0.78rem",cursor:"pointer",whiteSpace:"nowrap"}}>
                                  📁 Upload
                                  <input type="file" accept="audio/*" style={{display:"none"}} onChange={async (e) => {
                                    const file = e.target.files[0];
                                    if (!file) return;
                                    if (file.size > 512000) { alert("File too large — max 500 KB. Tip: use a short MP3 (1-2 seconds)."); e.target.value=""; return; }
                                    const reader = new FileReader();
                                    reader.onload = async (ev) => {
                                      const dataUrl = ev.target.result;
                                      await adapterRef.current.saveSetting(settingKey, dataUrl, userName);
                                      const fresh = await adapterRef.current.loadSettings();
                                      _updateSysSettings(fresh);
                                    };
                                    reader.readAsDataURL(file);
                                    e.target.value="";
                                  }}/>
                                </label>

                                <button onClick={() => {
                                  if (hasCustom) {
                                    window._playCustomSound(sysSettings[settingKey]);
                                  } else {
                                    const dingMap = {new_request:"default",high_priority:"high",completed:"done",cancelled:"cancelled",chat:"chat",break:"break"};
                                    window._playDing(dingMap[st.key]||"default");
                                  }
                                }} style={{padding:"0.45rem 0.85rem",borderRadius:"8px",background:"rgba(56,189,248,0.1)",border:"1px solid rgba(56,189,248,0.3)",color:"#38bdf8",fontWeight:900,fontSize:"0.78rem",cursor:"pointer",whiteSpace:"nowrap"}}>
                                  ▶ Preview
                                </button>

                                {hasCustom && (
                                  <button onClick={async () => {

                                    _updateSysSettings(fresh);
                                  }} style={{padding:"0.45rem 0.75rem",borderRadius:"8px",background:"transparent",border:"1px solid rgba(255,68,68,0.3)",color:"#ff4444",fontWeight:900,fontSize:"0.78rem",cursor:"pointer",whiteSpace:"nowrap"}}>

                            </div>
                          );

              </div>
            </div>
          {_breakPanelJsx}

      if (screen === "preplist") {

            <div style={{ minHeight:'100vh', ...bg, padding:'1.5rem', display:'flex', alignItems:'center', justifyContent:'center' }}>
              <div style={{ textAlign:'center', color:'#ff4444' }}>
                <h2>⚠️ Supervisor Access Required</h2>
                <button onClick={()=> setRoute("login")} style={{ padding:'0.7rem 1.5rem', background:'#ff4444', border:'none', borderRadius:'8px', color:'#fff', fontWeight:900, cursor:'pointer', marginTop:'1rem' }}>Go to Login</button>

            </div>

        }

        const currentList = editingPrepList ? prepLists.find(p => p.id === editingPrepList) : null;

        const approvedLists = prepLists.filter(p => p.status === 'approved');

        return (
          <div style={{ minHeight:'100vh', ...bg, padding:'1.5rem', position:'relative', overflow:'hidden' }}>

              <EnhancedHeader title="Operations" description="Prep lists, current demand, and out of rotation analysis" />

              {/* Generate Buttons */}
              {!editingPrepList && (
                <div style={{ marginBottom:'1.5rem', padding:'1.25rem', background:'rgba(167,139,250,0.08)', border:'1px solid rgba(167,139,250,0.3)', borderRadius:'14px' }}>
                  <div style={{ color:'#a78bfa', fontWeight:900, fontSize:'0.9rem', marginBottom:'1rem', textTransform:'uppercase', letterSpacing:'0.06em' }}>

                  <div style={{ display:'flex', gap:'1rem', flexWrap:'wrap' }}>

                      {prepListLoading ? '⏳ Generating...' : '☀️ Prep for 2nd Shift'}
                    </button>
                    <button onClick={() => generatePrepList('2nd')} disabled={prepListLoading}
                      style={{ padding:'1rem 1.5rem', background:'linear-gradient(135deg, #7c3aed 0%, #5b21b6 100%)', border:'none', borderRadius:'12px', color:'#fff', fontWeight:900, fontSize:'0.95rem', cursor: prepListLoading ? 'wait' : 'pointer', opacity: prepListLoading ? 0.6 : 1 }}>
                      {prepListLoading ? '⏳ Generating...' : '🌙 Prep for 1st Shift'}
                    </button>
                    <button onClick={() => generatePrepList('current')} disabled={prepListLoading}
                      style={{ padding:'1rem 1.5rem', background:'linear-gradient(135deg, #38bdf8 0%, #0ea5e9 100%)', border:'none', borderRadius:'12px', color:'#fff', fontWeight:900, fontSize:'0.95rem', cursor: prepListLoading ? 'wait' : 'pointer', opacity: prepListLoading ? 0.6 : 1 }}>

                      if (e.target.files[0]) analyzeFIFOOOR(e.target.files[0]);
                      e.target.value = '';

                    <button onClick={() => document.getElementById('oor-csv-input').click()} disabled={oorLoading}
                      style={{ padding:'1rem 1.5rem', background:'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)', border:'none', borderRadius:'12px', color:'#fff', fontWeight:900, fontSize:'0.95rem', cursor: oorLoading ? 'wait' : 'pointer', opacity: oorLoading ? 0.6 : 1 }}>
                      {oorLoading ? '⏳ Loading...' : '🚫 Out of Rotation'}

                  </div>
                  {prepListError && (
                    <div style={{ marginTop:'1rem', padding:'0.75rem', background:'rgba(255,68,68,0.1)', border:'1px solid #ff4444', borderRadius:'8px', color:'#ff4444', fontSize:'0.85rem' }}>

                    <div style={{ marginTop:'1rem', padding:'0.75rem', background: oorMessage.includes('✅') ? 'rgba(16,185,129,0.1)' : 'rgba(255,68,68,0.1)', border: oorMessage.includes('✅') ? '1px solid #10b981' : '1px solid #ff4444', borderRadius:'8px', color: oorMessage.includes('✅') ? '#10b981' : '#ff4444', fontSize:'0.85rem' }}>
                      {oorMessage}

                  )}
                </div>
              )}

              {/* Out of Rotation Items Display */}
              {oorItems.length > 0 && !editingPrepList && (
                <div style={{ marginBottom:'1.5rem', padding:'1.25rem', background:'rgba(239,68,68,0.08)', border:'1px solid rgba(239,68,68,0.3)', borderRadius:'14px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1rem', flexWrap:'wrap', gap:'0.75rem' }}>
                    <div style={{ color:'#ef4444', fontWeight:900, fontSize:'0.9rem', textTransform:'uppercase', letterSpacing:'0.06em' }}>

                    </div>
                    <div style={{ display:'flex', gap:'0.5rem', flexWrap:'wrap' }}>

                        <option value="PRECLAM">PRECLAM (Salad)</option>
                        <option value="PREBISTRO">PREBISTRO (Bistro)</option>
                        <option value="PREPWIP">PREPWIP (Bistro)</option>
                        <option value="PREAPPLE">PREAPPLE (Apple)</option>
                        <option value="PREPACK">PREPACK (MasterPacks)</option>
                        <option value="MASTERPKS">MASTERPKS (MasterPacks)</option>
                      </select>
                      <button onClick={exportOORAsCSV} style={{ padding:'0.5rem 1rem', background:'#10b981', border:'none', borderRadius:'8px', color:'#fff', fontWeight:900, fontSize:'0.8rem', cursor:'pointer' }}>
                        📥 Export CSV

                          <th style={{ padding:'0.5rem', textAlign:'left', fontWeight:900 }}>Harvest</th>
                          <th style={{ padding:'0.5rem', textAlign:'left', fontWeight:900 }}>Expire</th>

                    </table>

                </div>

              {/* Editing a Prep List */}
              {currentList && (
                <div style={{ marginBottom:'1.5rem', padding:'1.25rem', background:'rgba(15,23,42,0.9)', border:'2px solid #a78bfa', borderRadius:'14px' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'1rem', flexWrap:'wrap', gap:'0.75rem' }}>
                    <div>
                      <div style={{ color:'#a78bfa', fontWeight:900, fontSize:'1.1rem' }}>

                      <div style={{ color:'#64748b', fontSize:'0.8rem', marginTop:'0.25rem' }}>

                        {' • '}{currentList.items?.length || 0} items
                      </div>
                    </div>
                    <div style={{ display:'flex', gap:'0.5rem' }}>
                      {currentList.status === 'draft' && (
                        <button onClick={() => approvePrepList(currentList.id)}
                          style={{ padding:'0.65rem 1.25rem', background:'linear-gradient(135deg, #00ff88 0%, #00cc6f 100%)', border:'none', borderRadius:'10px', color:'#0a0e1a', fontWeight:900, cursor:'pointer' }}>

                        </button>
                      )}
                      <button onClick={() => setEditingPrepList(null)}
                        style={{ padding:'0.65rem 1rem', background:'transparent', border:'1px solid #64748b', borderRadius:'10px', color:'#64748b', fontWeight:900, cursor:'pointer' }}>
                        ← Back
                      </button>
                      <button onClick={() => deletePrepList(currentList.id)}
                        style={{ padding:'0.65rem 1rem', background:'rgba(255,68,68,0.1)', border:'1px solid #ff4444', borderRadius:'10px', color:'#ff4444', fontWeight:900, cursor:'pointer' }}>
                        🗑️
                      </button>
                    </div>
                  </div>

                  {/* Add Item Form */}
                  {currentList.status === 'draft' && (
                    <div style={{ marginBottom:'1rem', padding:'1rem', background:'rgba(0,255,136,0.05)', border:'1px solid rgba(0,255,136,0.2)', borderRadius:'10px' }}>
                      <div style={{ color:'#00ff88', fontWeight:900, fontSize:'0.8rem', marginBottom:'0.75rem', textTransform:'uppercase' }}>➕ Add Item</div>
                      <div style={{ display:'flex', gap:'0.5rem', flexWrap:'wrap', alignItems:'flex-end' }}>
                        <select value={prepListAddItem.room} onChange={(e) => setPrepListAddItem({...prepListAddItem, room: e.target.value})}
                          style={{ padding:'0.6rem', background:'#1e293b', border:'1px solid #334155', borderRadius:'8px', color:'#e2e8f0', minWidth:'120px' }}>
                          <option value="">Room...</option>

                        </select>
                        <input value={prepListAddItem.item} onChange={(e) => setPrepListAddItem({...prepListAddItem, item: e.target.value})}
                          placeholder="Item #" style={{ padding:'0.6rem', background:'#1e293b', border:'1px solid #334155', borderRadius:'8px', color:'#e2e8f0', width:'100px' }} />
